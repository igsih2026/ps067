name: Deploy TRITON Ocean Explorer to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjZqT3ktT3N3SzllckQ3OXoiLCJqdGkiOiJiMWNkNzE5ZC0wNGMxLTQ4ODItOGQ2My0zYWVhN2YwYzQ4NjQiLCJpZCI6NDkzNDM5LCJzdWIiOiJoYmR6OTM2IiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6Im9jZWFuM2R2aXoiLCJpYXQiOjE3ODkzNTkzODN9.Sk-onFG8P4ryhODpWap5iewRgIPdxYFU-O0zYud-sX4' }}

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
